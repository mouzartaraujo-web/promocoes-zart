<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" role="img" aria-label="PromoZart">
<title>PromoZart</title>
<!-- Symbol: Z integrated with shopping cart on the left -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cart handle (evolved from Z diagonal - teal-green) -->
  <path d="M35 20 C50 5, 70 5, 85 20" stroke="#0E6B4C" stroke-width="10" fill="none"/>

  <!-- Cart basket: front panel -->
  <path d="M25 45 H115 L85 100 H35 L25 45 Z" fill="#ffffff" stroke="#0E6B4C" stroke-width="8"/>

  <!-- Cart basket: side panel (teal) -->
  <path d="M25 45 L32 52 L85 100 L80 100 Z" fill="#0F8C62" stroke="#0E6B4C" stroke-width="5"/>

  <!-- Z element integrated in cart body - fixed: removed strikethrough path -->
  <!-- Original problematic path: <path d="M48 58 H68 L48 85 H68" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/> -->
  <!-- Fixed: Proper Z letter without strikethrough -->
  <path d="M48 58 H68 M48 85 H68" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Cart wheels -->
  <circle cx="48" cy="105" r="4" fill="#0E6B4C"/>
  <circle cx="82" cy="105" r="4" fill="#0E6B4C"/>
</g>

<!-- Text "PromoZart" on the right, no background, clean sans-serif -->
<text x="150" y="65" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#0F1714" letter-spacing="-0.3">Promo</text>
<text x="238" y="65" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#0E6B4C" letter-spacing="-0.3">Z</text>
<text x="262" y="65" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#0F1714" letter-spacing="-0.3">art</text>
</svg>
