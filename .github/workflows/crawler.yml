name: Executar Crawler PromoZart

on:
  schedule:
    # Executa a cada hora cheia (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Rodar Crawler PromoZart
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_WORD: ${{ secrets.ML_AFFILIATE_WORD }}
        run: |
          python -c "
import logging
logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(name)s - %(levelname)s - %(message)s')

# Ler URLs do arquivo de configuração
with open('config/urls_monitoradas.txt', 'r') as f:
    urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

print(f'URLs carregadas: {len(urls)}')
for u in urls:
    print(f'  - {u}')

from afiliados import orquestrador

ofertas = orquestrador.rodar(
    urls_mercado_livre=urls,
    limite_queda_pct=10.0,
    enviar_whatsapp=False
)
print(f'Ofertas encontradas: {len(ofertas)}')
for o in ofertas:
    titulo = o['titulo'][:60]
    queda = o['queda_pct']
    pid = o['produto_id']
    print(f'  - {titulo} | {queda}% OFF | {pid}')
"